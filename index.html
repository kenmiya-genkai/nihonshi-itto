<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.65}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(100% - 28px,740px);margin:auto;padding:26px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--green)}.badge{font-size:12px;color:var(--muted);background:#e9eee9;padding:5px 10px;border-radius:99px}.hero{padding:26px 0 20px}.eyebrow{color:var(--green);font-size:13px;font-weight:800;letter-spacing:.1em}.hero h1{font-size:clamp(30px,7vw,44px);letter-spacing:.02em;line-height:1.2;margin:8px 0}.hero p{color:var(--muted);margin:10px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin:14px 0}.section-title{font-size:17px;margin:0 0 14px}.modes{display:grid;grid-template-columns:1fr;gap:10px}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:750;transition:transform .12s,filter .12s}.btn:active{transform:scale(.985)}.primary{background:var(--green);color:white}.secondary{background:var(--green2);color:#15553f}.plain{background:#f0f3f0;color:var(--ink)}.small{padding:9px 13px;font-size:14px}.mode{display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:62px}.mode span:last-child{font-size:20px}.mode small{display:block;color:#d1e8db;font-weight:500}.mode.secondary small{color:var(--muted)}.era-row{padding:12px 0;border-bottom:1px solid var(--line)}.era-row:last-child{border:0;padding-bottom:0}.era-head{display:flex;justify-content:space-between;font-weight:700;font-size:14px}.era-count{color:var(--muted);font-weight:600}.track{height:7px;border-radius:99px;background:#edf1ed;margin-top:8px;overflow:hidden}.fill{height:100%;background:#4ca27e;border-radius:inherit}.subtle{font-size:13px;color:var(--muted)}.screen-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.screen-head h2{margin:0;font-size:21px}.question-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pill{border-radius:99px;background:#edf3ee;padding:4px 10px}.progress-line{height:8px;background:#e7ece7;border-radius:99px;margin:16px 0 22px;overflow:hidden}.progress-line>div{height:100%;background:var(--green);border-radius:inherit;transition:width .25s}.question{font-size:clamp(20px,5vw,27px);line-height:1.6;font-weight:750;margin:0 0 22px}.answer-form{display:flex;gap:9px}.answer-form input{min-width:0;flex:1;border:1px solid #cbd7ce;border-radius:13px;padding:13px 14px;background:white;outline:none}.answer-form input:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b521b}.feedback{margin-top:16px;padding:15px;border-radius:14px}.feedback.correct{background:#e8f4ec;color:#174f37}.feedback.wrong{background:#fbefe9;color:#743719}.feedback strong{display:block;font-size:17px}.feedback .answer{font-size:20px;font-weight:800;margin-top:5px}.feedback-actions{margin-top:14px}.result{text-align:center;padding:12px 2px}.score{font-size:52px;line-height:1.2;color:var(--green);font-weight:850;margin:10px}.result-actions{display:grid;gap:10px;margin-top:24px}.choice-list{display:grid;gap:10px}.chrono-cards{display:grid;gap:12px}.chrono-card{position:relative;width:100%;min-height:88px;padding:18px 54px 18px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-weight:750;text-align:left;line-height:1.5;box-shadow:0 4px 14px #20362c0a}.chrono-card:active{transform:scale(.99)}.chrono-card.selected{border-color:var(--green);background:#edf6f0}.chrono-rank{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;font-weight:800}.chrono-card:not(.selected) .chrono-rank{display:none}.chrono-actions{display:flex;gap:10px;margin-top:16px}.chrono-actions .btn{flex:1}.chrono-answer{margin:14px 0 0;padding:0;list-style:none;text-align:left}.chrono-answer li{padding:10px 0;border-bottom:1px solid var(--line)}.chrono-answer li:last-child{border:0}.chrono-year{color:var(--green);font-weight:850;margin-right:8px}.chrono-score{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}.choice{display:flex;justify-content:space-between;align-items:center;text-align:left}.empty{text-align:center;padding:24px 4px;color:var(--muted)}.hidden{display:none!important}.footer{text-align:center;color:#87918b;font-size:12px;padding-top:10px}@media(min-width:560px){.wrap{padding-top:36px}.modes{grid-template-columns:repeat(3,1fr)}.mode{display:block}.mode span:last-child{float:right}.mode small{margin-top:4px}.card{padding:26px}.result-actions{grid-template-columns:1fr 1fr}}

<script>
'use strict';
const QUESTIONS = [{"a":"貝塚","aliases":[],"chapter":"縄文","era":"原始・古代","q":"縄文時代の人々が、食料の残りかすなどを捨てた場所を何というか。"},{"a":"三内丸山遺跡","aliases":[],"chapter":"縄文","era":"原始・古代","q":"青森県にある、縄文時代の大規模な集落遺跡はどこか。"},{"a":"登呂遺跡","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"静岡県にある、弥生時代の環濠集落の遺跡はどこか。"},{"a":"吉野ヶ里遺跡","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"佐賀県にある、弥生時代の大規模な環濠集落の遺跡はどこか。"},{"a":"光武帝","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"57年、倭奴国の使者に金印「漢委奴国王」を授けた後漢の皇帝は誰か。"},{"a":"卑弥呼","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"『魏志』倭人伝に描かれた、邪馬台国を治めた女王は誰か。"},{"a":"魏","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"卑弥呼が使者を送り、「親魏倭王」の称号を受けた中国の王朝はどこか。"},{"a":"ヤマト政権","aliases":["大和政権"],"chapter":"古墳","era":"原始・古代","q":"3世紀ごろ、畿内を中心に成立したと考えられる連合政権を何というか。"},{"a":"大仙陵古墳","aliases":["大山古墳"],"chapter":"古墳","era":"原始・古代","q":"堺市にある、日本最大の前方後円墳（仁徳天皇陵）の正式名称は何か。"},{"a":"渡来人","aliases":[],"chapter":"古墳","era":"原始・古代","q":"古墳時代に朝鮮半島や中国から移住し、漢字や須恵器などの技術・文化を伝えた人々を何というか。"},{"a":"聖徳太子","aliases":["厩戸王","厩戸皇子"],"chapter":"飛鳥","era":"原始・古代","q":"593年、推古天皇の摂政となり、冠位十二階や十七条の憲法を定めた人物は誰か。"},{"a":"冠位十二階","aliases":[],"chapter":"飛鳥","era":"原始・古代","q":"603年に定められた、才能や功績によって位階を与える制度を何というか。"},{"a":"小野妹子","aliases":[],"chapter":"飛鳥","era":"原始・古代","q":"607年、隋に派遣された遣隋使の代表的な使者は誰か。"},{"a":"大化の改新","aliases":[],"chapter":"律令国家の成立","era":"原始・古代","q":"645年、中大兄皇子らが蘇我氏を滅ぼして始めた政治改革を何というか。"},{"a":"中臣鎌足","aliases":["藤原鎌足"],"chapter":"律令国家の成立","era":"原始・古代","q":"大化の改新で中大兄皇子を助け、後に藤原姓を与えられた人物は誰か。"},{"a":"大宝律令","aliases":[],"chapter":"律令国家の成立","era":"原始・古代","q":"701年に完成した、律と令をそろえた法典を何というか。"},{"a":"国","aliases":["令制国"],"chapter":"律令国家の成立","era":"原始・古代","q":"律令制のもとで地方行政の単位とされ、国司が派遣された区画を何というか。"},{"a":"平城京","aliases":[],"chapter":"奈良","era":"原始・古代","q":"710年に都が移された、唐の長安にならって造られた都はどこか。"},{"a":"元明天皇","aliases":[],"chapter":"奈良","era":"原始・古代","q":"平城京への遷都を行った天皇は誰か。"},{"a":"古事記","aliases":[],"chapter":"奈良","era":"原始・古代","q":"712年に完成した、現存する日本最古の歴史書は何か。"},{"a":"日本書紀","aliases":[],"chapter":"奈良","era":"原始・古代","q":"720年に完成した、天武天皇の命で編纂された勅撰の国史は何か。"},{"a":"風土記","aliases":[],"chapter":"奈良","era":"原始・古代","q":"713年、各地の地名の由来や産物・伝承を報告させて編纂された書物は何か。"},{"a":"班田収授法","aliases":[],"chapter":"奈良","era":"原始・古代","q":"律令制のもとで、戸籍に登録された人々に口分田を分け与える制度を何というか。"},{"a":"墾田永年私財法","aliases":[],"chapter":"奈良","era":"原始・古代","q":"743年に出された、新しく開墾した土地の永久私有を認めた法令を何というか。"},{"a":"唐招提寺","aliases":[],"chapter":"奈良","era":"原始・古代","q":"754年に来日した唐の僧・鑑真が、奈良に開いた寺はどこか。"},{"a":"盧舎那仏","aliases":["るしゃな仏","毘盧遮那仏"],"chapter":"奈良","era":"原始・古代","q":"聖武天皇の発願で東大寺に造られた大仏の正式な名称は何か。"},{"a":"桓武天皇","aliases":[],"chapter":"平安","era":"原始・古代","q":"794年に平安京へ遷都した天皇は誰か。"},{"a":"坂上田村麻呂","aliases":[],"chapter":"平安","era":"原始・古代","q":"桓武天皇に初代の征夷大将軍に任命され、蝦夷の征討で活躍した人物は誰か。"},{"a":"菅原道真","aliases":[],"chapter":"平安","era":"原始・古代","q":"894年、遣唐使の廃止を建議した学者は誰か。"},{"a":"摂関政治","aliases":[],"chapter":"平安","era":"原始・古代","q":"平安時代中期、藤原氏が天皇の外戚として摂政・関白の地位を独占した政治を何というか。"},{"a":"縄文土器","aliases":[],"chapter":"縄文","era":"原始・古代","q":"縄文時代の土器で、表面に縄を転がしてつけた文様がある土器を何というか。"},{"a":"竪穴住居","aliases":["たて穴住居","竪穴式住居"],"chapter":"縄文","era":"原始・古代","q":"縄文時代の代表的な住まいで、地面を掘りくぼめ、柱を立てて屋根をかけた住居を何というか。"},{"a":"土偶","aliases":[],"chapter":"縄文","era":"原始・古代","q":"縄文時代に作られた、主に女性をかたどった素焼きの人形を何というか。"},{"a":"水稲耕作","aliases":["水稲農耕"],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"弥生時代に大陸から伝わった、水田で稲を栽培する農耕を何というか。"},{"a":"高床倉庫","aliases":["高床式倉庫"],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"弥生時代に収穫物を蓄えるために建てられた、床を高くした倉庫を何というか。"},{"a":"弥生土器","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"弥生時代の土器で、縄文土器より薄手で赤褐色の土器を何というか。"},{"a":"倭国大乱","aliases":[],"chapter":"弥生・大陸との交渉","era":"原始・古代","q":"2世紀の終わりごろ、倭国で長く続いたとされる大きな争乱を何というか。"},{"a":"埴輪","aliases":[],"chapter":"古墳","era":"原始・古代","q":"古墳の上や周囲に並べられた、人物や動物などをかたどった素焼きの器物を何というか。"},{"a":"須恵器","aliases":[],"chapter":"古墳","era":"原始・古代","q":"古墳時代に渡来人が伝えた製法で作られた、ろくろを使い高温で焼いた灰色の硬い土器を何というか。"},{"a":"大王","aliases":[],"chapter":"古墳","era":"原始・古代","q":"古墳時代、ヤマト政権の王を指した称号を何というか。"},{"a":"三角縁神獣鏡","aliases":[],"chapter":"古墳","era":"原始・古代","q":"魏の皇帝 const CHOICES = [{"answer":"弥生土器","chapter":"弥生","choices":["弥生土器","縄文土器","土師器","須恵器"],"era":"原始・古代","explanation":"正解は弥生土器。縄文土器は縄文時代の厚手で縄目文様のある土器。土師器と須恵器は古墳時代の土器で、須恵器は朝鮮半島から伝わった硬質のもの。","q":"稲作と金属器の使用が始まった時代に用いられた、薄手で赤褐色の土器はどれか。"},{"answer":"卑弥呼","chapter":"弥生","choices":["卑弥呼","推古天皇","持統天皇","台与"],"era":"原始・古代","explanation":"正解は卑弥呼。推古天皇は6世紀末〜7世紀の天皇、持統天皇は7世紀末の天皇。台与は卑弥呼の死後に邪馬台国を継いだ女王だが、「親魏倭王」の称号を受けたのは卑弥呼。","q":"239年に魏へ使者を送り、「親魏倭王」の称号を受けた邪馬台国の女王は誰か。"},{"answer":"稲作を行い、身分の差があった","chapter":"弥生","choices":["身分による区別がなかった","稲作を行い、身分の差があった","文字が広く使われていた","鉄の貨幣が流通していた"],"era":"原始・古代","explanation":"正解は「稲作を行い、身分の差があった」。倭人伝は身分の上下の差があったと伝えており、「区別がなかった」は逆。文字の使用や鉄の貨幣の流通は当時の記述からは確認できない。","q":"『魏志』倭人伝が伝える当時の日本の様子として正しいものはどれか。"},{"answer":"奴国","chapter":"弥生","choices":["奴国","邪馬台国","狗奴国","投馬国"],"era":"原始・古代","explanation":"正解は奴国。邪馬台国は3世紀に卑弥呼が治めた国。狗奴国は邪馬台国と対立した国、投馬国は倭人伝に名の出る国だが、金印を授けられたのは奴国。","q":"57年に後漢へ使者を送り、金印「漢委奴国王」を授けられた国はどこか。"},{"answer":"前方後円墳","chapter":"古墳","choices":["前方後円墳","円墳","方墳","上円下方墳"],"era":"原始・古代","explanation":"正解は前方後円墳。円墳・方墳はそれ単独の形式の古墳。上円下方墳は奈良時代の天皇陵などにみられる形式で、古墳時代の大王墓の形式ではない。","q":"円形と方形を組み合わせた、日本最大級の古墳の形式はどれか。"},{"answer":"大阪府","chapter":"古墳","choices":["大阪府","奈良県","京都府","兵庫県"],"era":"原始・古代","explanation":"正解は大阪府（堺市）。奈良県は飛鳥・平城京の地、京都府は平安京の地、兵庫県にも五色塚古墳など大きな古墳はあるが、日本最大の前方後円墳は堺の大山古墳。","q":"大山古墳（伝仁徳天皇陵）が所在する都道府県はどこか。"},{"answer":"蘇我馬子","chapter":"飛鳥","choices":["蘇我馬子","中大兄皇子","藤原不比等","大伴金村"],"era":"原始・古代","explanation":"正解は蘇我馬子。中大兄皇子は次の世代で大化の改新の中心人物。藤原不比等は奈良時代初期の政治家、大伴金村は6世紀前半の豪族で、冠位十二階の制定には関わっていない。","q":"聖徳太子とともに政治を行い、冠位十二階の制定に関わった人物は誰か。"},{"answer":"隋","chapter":"飛鳥","choices":["隋","唐","高句麗","百済"],"era":"原始・古代","explanation":"正解は隋。唐が中国を統一するのは618年で、遣唐使は630年から始まる。高句麗・百済は朝鮮半島の国々で、小野妹子の派遣先は隋の煬帝のもと。","q":"607年に小野妹子が使者として派遣された国はどこか。"},{"answer":"公地公民","chapter":"飛鳥","choices":["公地公民","班田収授","墾田永年私財法","荘園整理"],"era":"原始・古代","explanation":"正解は公地公民。班田収授はこの原則を具体化した土地制度。墾田永年私財法は奈良時代に公地公民の原則を崩していく法令で、荘園は平安時代以降に広がった私有地。","q":"大化の改新で掲げられた、土地と人民を天皇のものとする原則はどれか。"},{"answer":"大宝律令","chapter":"律令","choices":["大宝律令","養老律令","近江令","飛鳥浄御原令"],"era":"原始・古代","explanation":"正解は大宝律令（701年）。養老律令は718年に編纂され施行は757年。近江令は天智天皇期の法令とされるが内容に諸説がある。飛鳥浄御原令は天武・持統天皇期の令。","q":"701年に完成した律令はどれか。"},{"answer":"租","chapter":"律令","choices":["租","調","庸","雑徭"],"era":"原始・古代","explanation":"正解は租（収穫の約3%を稲で納める）。調は地方の特産物を納める税、庸は労役の代わりに布などを納める税、雑徭は国司のもとで働く労役そのもの。","q":"律令制で、口分田を与えられた人々が収穫の一部を稲で納めた税はどれか。"},{"answer":"三世一身法","chapter":"奈良","choices":["三世一身法","墾田永年私財法","班田収授法","公地公民制"],"era":"原始・古代","explanation":"正解は三世一身法（723年）。墾田永年私財法は743年の法令で永久私有を認めた。班田収授法は口分田を班給する制度そのもの、公地公民制は土地・人民を公とする原則を指す。","q":"723年に出された、開墾した土地の三代までの私有を認めた法令はどれか。"},{"answer":"人口の増加で口分田が不足したこと","chapter":"奈良","choices":["人口の増加で口分田が不足したこと","戦争で田畑が荒廃したこと","貴族が律令に反対したこと","仏教の布教を進めるため"],"era":"原始・古代","explanation":"正解は口分田の不足。戦争による荒廃や貴族の反対が理由ではなく、人口増加で班給する田が足りなくなったため、政府は開墾を奨励する方向に転じた。仏教布教はこの法令の目的ではない。","q":"743年に墾田永年私財法が出された背景として正しいものはどれか。"},{"answer":"聖武天皇","chapter":"奈良","choices":["聖武天皇","桓武天皇","天武天皇","文武天皇"],"era":"原始・古代","explanation":"正解は聖武天皇。桓武天皇は平安京遷都を行った天皇。天武天皇は壬申の乱に勝ち律令国家の基礎を固めた。文武天皇は大宝律令が完成した時期の天皇だが、大仏造立の詔は聖武天皇。","q":"東大寺大仏の造立を命じた天皇は誰か。"},{"answer":"鑑真","chapter":"奈良","choices":["鑑真","玄奘","空海","最澄"],"era":"原始・古代","explanation":"正解は鑑真。玄奘（三蔵法師）はインドへ経典を求めた唐の僧で、日本には来ていない。空海と最澄は平安時代に唐へ渡った日本の僧。","q":"唐招提寺を開いた、唐出身の僧は誰か。"},{"answer":"桓武天皇","chapter":"平安","choices":["桓武天皇","聖武天皇","嵯峨天皇","醍醐天皇"],"era":"原始・古代","explanation":"正解は桓武天皇。聖武天皇は平城京の時代の天皇。嵯峨天皇は桓武天皇の子で平安時代初期、醍醐天皇は10世紀の天皇で遷都には関わらない。","q":"794年に平安京へ遷都した天皇は誰か。"},{"answer":"天台宗 ― 比叡山","chapter":"平安","choices":["天台宗 ― 高野山","真言宗 ― 比叡山","天台宗 ― 比叡山","真言宗 ― 平等院"],"era":"原始・古代","explanation":"正解は「天台宗 ― 比叡山」。高野山は空海の真言宗の拠点なので「天台宗 ― 高野山」は誤り。比叡山が最澄の拠点なので「真言宗 ― 比叡山」も誤り。平等院は藤原頼通が別荘を寺に改めたもので、空海の拠点ではない。","q":"最澄が伝えた宗派とその拠点の組み合わせとして正しいものはどれか。"},{"answer":"摂関政治","chapter":"平安","choices":["摂関政治","院政","執権政治","守護政治"],"era":"原始・古代","explanation":"正解は摂関政治。院政は11世紀末から始まる上皇による政治。執権政治は鎌倉幕府で北条氏が行った政治。守護政治という形は一般的ではなく、室町時代の守護大名の台頭とは別の話。","q":"藤原氏が摂政・関白の地位について権力を握った政治を何というか。"},{"answer":"院政","chapter":"平安","choices":["院政","摂関政治","執権政治","専制政治"],"era":"原始・古代","explanation":"正解は院政。摂関政治は藤原氏が外戚として実権を握った政治で、これへの対抗として院政が始まった。執権政治は鎌倉幕府の北条氏の政治。「専制政治」はこの出来事を指す用語ではない。","q":"11世紀末に白河上皇が始めた、上皇が政治の実権を握る政治を何というか。"},{"answer":"菅原道真","chapter":"平安","choices":["菅原道真","藤原時平","大伴家持","阿倍仲麻呂"],"era":"原始・古代","explanation":"正解は菅原道真。藤原時平は道真を大宰府に左遷した側の人物。大伴家持は奈良時代の歌人で『万葉集』の編纂に関わった。阿倍仲麻呂は遣唐使として唐に渡り、帰国できずに唐で生涯を終えた人物。","q":"894年に遣唐使の廃止を建議した人物は誰か。"},{"answer":"御家人","chapter":"鎌倉","choices":["御家人","国人","地侍","守護代"],"era":"中世","explanation":"正解は御家人。将軍から所領の支配を認められ、代わりに軍役などの奉公を果たした。国人は南北朝〜室町期に在地で力をつけた武士層、地侍は戦国期に村落へ土着した小武士・有力農民層、守護代は守護に代わって現地を治めた代官で、いずれも将軍と主従関係を結んだ鎌倉の武士を指す語ではない。","q":"鎌倉幕府で、将軍と主従関係を結び、所領の支配を認められる代わりに軍事的な奉公を果たした武士を何というか。"},{"answer":"御成敗式目","chapter":"鎌倉","choices":["御成敗式目","分国法","武家諸法度","バテレン追放令"],"era":"中世","explanation":"正解は御成敗式目（貞永式目）。1232年に北条泰時が武家社会の慣習や道理をもとに定めた、最初の武家法。分国法は戦国大名が領国支配のために定めた法、武家諸法度は江戸幕府が大名統制のために定めた法令、バテレン追放令は豊臣秀吉がキリスト教宣教師の退去を命じた法令で、いずれも時代が異なる。","q":"1232年に制定された、武家社会の慣習や道理にもとづく最初の武家法はどれか。"},{"answer":"元寇","chapter":"鎌倉","choices":["元寇","応永の外寇","刀伊の入寇","白村江の戦い"],"era":"中世","explanation":"正解は元寇（蒙古襲来）。1274年の文永の役と1281年の弘安の役の2度にわたり、元と高麗の連合軍が九州北部へ侵攻した。応永の外寇は1419年に李氏朝鮮が対馬を攻撃した事件、刀伊の入寇は1019年に女真系の海賊が九州北部を襲った事件、白村江の戦いは663年に倭国が唐・新羅連合軍に敗れた戦いで、いずれも別の出来事。","q":"1274年と1281年の2度にわたり、モンゴル帝国（元）と高麗の連合軍が日本へ侵攻した出来事を何というか。"},{"answer":"承久の乱","chapter":"鎌倉","choices":["承久の乱","保元の乱","平治の乱","宝治合戦"],"era":"中世","explanation":"正解は承久の乱（1221年）。後鳥羽上皇が北条義時追討を掲げて挙兵したが幕府軍に敗れ、乱後に六波羅探題が置かれた。保元の乱（1156年）と平治の乱（1159年）は平安末の朝廷・武士の争い、宝治合戦（1247年）は幕府内部で北条氏が三浦氏を滅ぼした争いで、いずれも上皇による幕府打倒の戦いではない。","q":"1221年、後鳥羽上皇が幕府打倒を目指して挙兵し、幕府側が勝利した乱はどれか。"},{"answer":"守護","chapter":"鎌倉","choices":["守護","地頭","国司","検非違使"],"era":"中世","explanation":"正解は守護。源頼朝が諸国に置き、大番催促・謀叛人の逮捕・殺害人の逮捕という「大犯三箇条」の職務を担った。地頭は荘園や公領に置かれて土地の管理や年貢の徴収にあたった役職、国司は律令制の地方官、検非違使は平安京の警察・司法を担った役職で、職務の内容が異なる。","q":"鎌倉時代に源頼朝が諸国に設置し、大番催促や謀叛人の逮捕など軍事・警察の職務を担った役職はどれか。"},{"answer":"法然","chapter":"鎌倉","choices":["法然","親鸞","道元","日蓮"],"era":"中世","explanation":"正解は法然。『選択本願念仏集』を著して浄土宗を開き、阿弥陀仏の名を唱える専修念仏を説いた。親鸞は法然の弟子で浄土真宗を開き悪人正機を説いた人物、道元は曹洞宗を開き只管打坐を説いた人物、日蓮は法華経を重んじ題目を唱える日蓮宗を開いた人物で、いずれも説いた内容が異なる。","q":"『選択本願念仏集』を著し、ひたすら念仏を唱えることで救われると説いた鎌倉時代の僧は誰か。"},{"answer":"運慶","chapter":"鎌倉","choices":["運慶","定朝","湛慶","康慶"],"era":"中世","explanation":"正解は運慶。快慶ら慶派の仏師とともに東大寺南大門の金剛力士像を制作し、写実的で力強い鎌倉彫刻を代表する。定朝は平安時代後期の仏師で寄木造の技法を完成させた人物、湛慶は運慶の子で慶派を継いだ人物、康慶は運慶の父にあたる仏師で、いずれも金剛力士像の制作者ではない。","q":"東大寺南大門の金剛力士像を慶派の仏師たちとともに制作した、鎌倉時代を代表する仏師は誰か。"},{"answer":"永仁の徳政令","chapter":"鎌倉","choices":["永仁の徳政令","半済令","撰銭令","分一徳政令"],"era":"中世","explanation":"正解は永仁の徳政令（1297年）。元寇後の恩賞不足などで困窮した御家人を救うため、所領の売却や質入れを禁じ、売られた所領の無償返還を命じた。半済令は室町時代に荘園の年貢の半分を兵粮として守護が徴収することを認めた法令、撰銭令は悪銭の受け取り拒否を禁じた法令、分一徳政令は室町時代に債務の一部支払いで帳消しを認めた法令で、いずれも御家人救済の法令ではない。","q":"1297年に出された、御家人の所領の売却・質入れを禁じ、売られた所領の無償での返還を命じた法令はどれか。"},{"answer":"建武の新政","chapter":"南北朝・室町","choices":["建武の新政","大政奉還","王政復古","尊王攘夷"],"era":"中世","explanation":"正解は建武の新政。1333年に鎌倉幕府を倒した後醍醐天皇が、貴族や武士の登用など天皇中心の改革を進めたが、武士の不満を招いて短期間で崩壊した。大政奉還は1867年に徳川慶喜が政権を朝廷へ返したこと、王政復古は明治維新期に天皇中心の政治への復帰を宣言したこと、尊王攘夷は幕末の思想・運動で、いずれも幕末〜明治の出来事。","q":"1333年に鎌倉幕府を倒した後醍醐天皇が始めた、天皇中心の政治を何というか。"},{"answer":"足利義満","chapter":"南北朝・室町","choices":["足利義満","足利義政","足利尊氏","足利義昭"],"era":"中世","explanation":"正解は足利義満（3代将軍）。1392年の南北朝合一を実現し、勘合貿易を始め、北山に金閣を建てた。足利義政は8代将軍で銀閣に代表される東山文化の時期の将軍、足利尊氏は室町幕府を開いた初代将軍、足利義昭は織田信長に擁立された15代（最後）の将軍で、いずれも南北朝合一を行った将軍ではない。","q":"南北朝を合一し、日明貿易（勘合貿易）を始め、金閣を建てた室町幕府の3代将軍は誰か。"},{"answer":"勘合貿易","chapter":"南北朝・室町","choices":["勘合貿易","朱印船貿易","南蛮貿易","日宋貿易"],"era":"中世","explanation":"正解は勘合貿易。正式な貿易船と倭寇（海賊）を区別するため、勘合（勘合符）を持参させたことからこの名で呼ばれる。朱印船貿易は江戸時代初期に朱印状を持つ船が行った貿易、南蛮貿易は16世紀にポルトガルやスペインとの間で行われた貿易、日宋貿易は平安時代末〜鎌倉時代に宋との間で行われた私貿易に近い貿易で、いずれも明との公貿易ではない。","q":"室町時代に明との間で行われた貿易で、海賊と区別するために勘合（勘合符）を用いたことから呼ばれるものはどれか。"},{"answer":"応仁の乱","chapter":"南北朝・室町","choices":["応仁の乱","観応の擾乱","明徳の乱","永享の乱"],"era":"中世","explanation":"正解は応仁の乱（1467〜1477年）。細川氏と山名氏の対立に将軍家と管領家の継承争いが絡み、京都を主戦場として長期化し、戦国時代の幕開けとなった。観応の擾乱は南北朝初期の足利尊氏と弟・直義の対立、明徳の乱は1391年に足利義満が山名氏を討った乱、永享の乱は1438年に鎌倉公方・足利持氏が幕府と対立した乱で、いずれも将軍後継問題を発端とする内乱ではない。","q":"1467年に始まり、将軍の後継問題と管領家の内紛から京都を主戦場として長期化した内乱はどれか。"},{"answer":"東山文化","chapter":"南北朝・室町","choices":["東山文化","北山文化","天平文化","化政文化"],"era":"中世","explanation":"正解は東山文化。足利義政が東山に山荘（銀閣）を営み、書院造や茶道・生け花の源流が生まれた、禅宗の影響を受けた質素で幽玄な文化。北山文化は足利義満の金閣に代表される公家文化と武家文化が融合した文化、天平文化は奈良時代の唐風文化、化政文化は江戸時代後期の町人文化で、いずれも時代と担い手が異なる。","q":"足利義政の時代に花開き、銀閣や書院造に代表される、禅宗の影響を受けた質素な文化を何というか。"},{"answer":"正長の土一揆","chapter":"南北朝・室町","choices":["正長の土一揆","山城の国一揆","加賀の一向一揆","島原・天草一揆"],"era":"中世","explanation":"正解は正長の土一揆（1428年）。近畿地方の農民らが借金の帳消し（徳政）を求めて蜂起した、日本で最初の大規模な土一揆とされる。山城の国一揆は1485年に国人や農民が守護の軍勢を追放したもの、加賀の一向一揆は1488年に浄土真宗の門徒が守護を倒したもの、島原・天草一揆は1637年の江戸時代の一揆で、いずれも1428年の徳政要求の蜂起ではない。","q":"1428年、近畿地方の農民らが徳政令（借金の帳消し）を求めて起こした、記録に残る最初の大規模な土一揆はどれか。"},{"answer":"連歌","chapter":"南北朝・室町","choices":["連歌","和歌","俳諧","狂歌"],"era":"中世","explanation":"正解は連歌。5・7・5の上の句と7・7の下の句を複数人で詠みつぐ形式で、宗祇らが地方を旅しながら広め大成させた。和歌は一人で詠む短歌形式の詩歌、俳諧は近世に発展し松尾芭蕉が蕉風を確立した詩歌、狂歌は江戸時代中期に流行した滑稽な内容の和歌で、いずれも複数人で詠みつぐ形式ではない。","q":"複数の人が上の句と下の句を交互に詠みつぐ形式の詩歌で、南北朝・室町時代に宗祇らによって大成されたものはどれか。"},{"answer":"撰銭令","chapter":"南北朝・室町","choices":["撰銭令","分国法","楽市令","半済令"],"era":"中世","explanation":"正解は撰銭令。室町幕府や戦国大名が、撰銭（質の悪い銭の受け取り拒否）を禁じて銭の流通を円滑にしようとした法令。分国法は戦国大名の領国支配の法、楽市令は市場の座の特権を廃して自由な取引を認めた法令、半済令は荘園の年貢の半分を兵粮として守護が徴収することを認めた法令で、いずれも銭の流通を整える法令ではない。","q":"室町時代、悪銭（質の悪い私鋳銭など）の受け取り拒否による取引の混乱を防ぐため、幕府や大名が繰り返し出した法令はどれか。"},{"answer":"下剋上","chapter":"戦国","choices":["下剋上","公武合体","一国一城令","惣村"],"era":"中世","explanation":"正解は下剋上。戦乱の中で実力本位の風潮が強まり、守護大名が没落して家臣出身の戦国大名が台頭する背景となった。公武合体は幕末に朝廷と幕府の協力で国政を進めようとした方針、一国一城令は江戸幕府が大名の居城を一つに限った法令、惣村は農民の自治的な村落共同体を指す語で、いずれも身分秩序を覆す風潮を表す語ではない。","q":"戦国時代に、家臣が主君を倒したり、実力のある者が身分の秩序を超えて台頭したりする風潮を何というか。"},{"answer":"喧嘩両成敗","chapter":"戦国","choices":["喧嘩両成敗","切捨御免","生類憐みの令","武家諸法度"],"era":"中世","explanation":"正解は喧嘩両成敗。今川氏や武田氏などの分国法に見られる考え方で、領内の争いを抑えるために理由のいかんを問わず双方を処罰した。切捨御免は江戸時代に認められた武士の特権、生類憐みの令は江戸時代の将軍・徳川綱吉が出した動物愛護の法令、武家諸法度は江戸幕府が大名を統制した法令で、いずれも戦国大名の分国法の規定ではない。","q":"戦国大名が領国支配の法（分国法）に定めた、理由を問わず喧嘩の当事者双方を処罰する考え方を何というか。"},{"answer":"フランシスコ・ザビエル","chapter":"戦国","choices":["フランシスコ・ザビエル","マテオ・リッチ","三浦按針","ヤン・ヨーステン"],"era":"中世","explanation":"正解はフランシスコ・ザビエル。イエズス会の宣教師で、1549年に鹿児島に上陸してキリスト教を伝えた。マテオ・リッチは同じイエズス会でも明（中国）で布教した宣教師、三浦按針（ウィリアム・アダムス）は江戸時代初期に来日したイギリス人、ヤン・ヨーステンは同じく江戸時代初期に来日したオランダ人で、いずれもキリスト教を日本に伝えた人物ではない。","q":"1549年に鹿児島に来航し、日本にキリスト教を伝えたイエズス会の宣教師は誰か。"},{"answer":"楽市令","chapter":"戦国","choices":["楽市令","撰銭令","検地","関所の設置"],"era":"中世","explanation":"正解は楽市令。六角氏など戦国大名が城下町のにぎわいを促すために出し、座が持つ営業の特権を廃して誰もが自由に商売できるようにした。撰銭令は悪銭の受け取り拒否を禁じた法令、検地は田畑の面積や収穫高を調べる土地調査、関所は通行の取り締まりや関銭の徴収のための施設で戦国大名はむしろ撤廃を進めたもので、いずれも市場の自由化の政策ではない。","q":"戦国大名が城下町の発展を促すため、市場の座の特権を廃して自由な商取引を認めた法令はどれか。"},{"answer":"検地帳に耕作者を登録し、面積の単位や枡を統一した","chapter":"織豊","choices":["検地帳に耕作者を登録し、面積の単位や枡を統一した","全国の土地をすべて幕府の直轄地とした","農民どうしの土地の売買を全面的に自由化した","年貢を米ではなく金で納めさせた"],"era":"近世","explanation":"正解は、統一した基準で検地を行い耕作者を検地帳に登録した、という内容。土地は大名や寺社などの領地として残り、すべてが直轄地になったわけではない。土地売買はむしろ制限され、耕作権が固定された。年貢は石高に応じて米で納めるのが原則で、金納ではない。","q":"豊臣秀吉が行った太閤検地の内容として正しいものはどれか。"},{"answer":"百姓の一揆を防ぎ、兵農分離を進めるため","chapter":"織豊","choices":["百姓の一揆を防ぎ、兵農分離を進めるため","鉄砲の製造そのものを禁止するため","大名の兵力を削減するため","南蛮貿易を拡大するため"],"era":"近世","explanation":"正解は、百姓から武器を取り上げて一揆を防ぎ、兵農分離を進めるため。刀狩令は鉄砲の製造を禁じたものではない。対象は大名ではなく百姓であり、大名の兵力削減が目的ではない。貿易の拡大とは無関係の国内政策である。","q":"1588年に豊臣秀吉が出した刀狩令の目的として正しいものはどれか。"},{"answer":"座の特権を廃止し、城下町の商業を活性化するため","chapter":"織豊","choices":["座の特権を廃止し、城下町の商業を活性化するため","寺社の経済的特権を強化するため","外国商人の市場への参入を禁止するため","貨幣の使用を禁止し物々交換に戻すため"],"era":"近世","explanation":"正解は、座の営業独占などの特権をなくし、誰もが自由に商売できるようにして城下町を繁栄させるため。寺社の特権を強める政策ではなく、むしろ既存の特権を排した。外国商人を締め出すものでも、貨幣を禁止するものでもない。","q":"織田信長が楽市令を出した目的として正しいものはどれか。"},{"answer":"宣教師の国外退去を命じたが、南蛮貿易自体は禁止しなかった","chapter":"織豊","choices":["宣教師の国外退去を命じたが、南蛮貿易自体は禁止しなかった","キリスト教の信仰と布教を全面的に許可した","すべての外国船の来航を禁止した","国内のキリシタン全員を直ちに国外へ追放した"],"era":"近世","explanation":"正解は、宣教師の退去を命じつつ貿易は認めた、という内容。信仰や布教を許可したものでは決してない。すべての外国船の来航禁止は、のちの江戸幕府の鎖国体制の完成段階のこと。キリシタン全員を直ちに追放したものでもない。","q":"1587年に豊臣秀吉が出したバテレン追放令について正しいものはどれか。"},{"answer":"大名が新しく城を築くことを禁止した","chapter":"江戸前期","choices":["大名が新しく城を築くことを禁止した","大名に隔年での参勤交代を義務づけた","大名どうしの領地交換を自由に認めた","学問（文）の奨励を禁止した"],"era":"近世","explanation":"正解は、新規の築城禁止。1615年の元和の武家諸法度は一国一城令とあわせて大名の軍事力を抑えた。参勤交代が制度化されたのは1635年の寛永の改定。領地の交換（転封）は幕府の命令で行われるもので自由ではない。法度は文武両道を奨励しており、学問を禁じていない。","q":"1615年に制定された武家諸法度（元和令）の内容として正しいものはどれか。"},{"answer":"幕府の朱印状を持つ日本の船が東南アジアへ渡航して行った貿易","chapter":"江戸前期","choices":["幕府の朱印状を持つ日本の船が東南アジアへ渡航して行った貿易","オランダ船だけに許可された貿易","朝鮮との間でのみ行われた貿易","明と公式な国交を結んで行われた貿易"],"era":"近世","explanation":"正解は、朱印状を持つ日本船が東南アジア各地へ渡って行った貿易で、渡航先には日本町もできた。オランダとの貿易は鎖国後も長崎で続いたが朱印船貿易ではない。朝鮮との貿易は主に対馬藩が担った。明とは公式な国交がなく、勘合貿易は室町時代に終わっている。","q":"朱印船貿易について正しいものはどれか。"},{"answer":"1639年にポルトガル船の来航が禁止された","chapter":"江戸前期","choices":["1639年にポルトガル船の来航が禁止された","オランダ船の来航も全面的に禁止された","中国船の来航も全面的に禁止された","朝鮮通信使の来日が禁止された"],"era":"近世","explanation":"正解は1639年のポルトガル船来航禁止で、これにより鎖国体制は完成した。オランダ船は長崎の出島で貿易が続き、禁止されていない。中国船も長崎貿易が認められた。朝鮮通信使の来日もその後も続いており、禁止されていない。","q":"いわゆる鎖国体制が完成する過程の出来事として正しいものはどれか。"},{"answer":"五人組","chapter":"江戸前期","choices":["五人組","寄合","名主","百姓代"],"era":"近世","explanation":"正解は五人組。本百姓の数戸で編成され、年貢の完納や犯罪の防止について連帯責任を負った。寄合は村の重要事項を話し合う会議。名主は村役人の筆頭、百姓代は村役人を監視する役職で、いずれも連帯責任の組織そのものではない。","q":"江戸時代の村で、年貢の完納や治安の維持について連帯責任を負った組織はどれか。"},{"answer":"幕府はキリスト教への弾圧を強め、鎖国政策をさらに進めた","chapter":"江戸前期","choices":["幕府はキリスト教への弾圧を強め、鎖国政策をさらに進めた","幕府はキリスト教の布教を公式に認めた","一揆をきっかけに参勤交代が廃止された","島原藩の幕府からの独立が認められた"],"era":"近世","explanation":"正解は、一揆の鎮圧後に弾圧と鎖国が一層強化された、という点。布教が公式に認められたことはない。参勤交代はこの時期に制度化が進んだ制度で、廃止されていない。島原藩主は改易され、独立など認められていない。","q":"1637〜38年の島原・天草一揆のあとの幕府の対応として正しいものはどれか。"},{"answer":"過去数年の収穫量の平均をもとに、年貢率を一定期間固定する方式","chapter":"江戸中期","choices":["過去数年の収穫量の平均をもとに、年貢率を一定期間固定する方式","毎年の作柄を実地に調べて年貢額を決める方式","年貢をすべて金で納めさせる方式","凶作の年には年貢を全額免除する方式"],"era":"近世","explanation":"正解は定免法の説明。享保の改革で吉宗が採用し、年貢収入の安定と増徴を図った。毎年の作柄を検分して決めるのは検見法で、定免法とは逆の方式。年貢は米で納めるのが原則であり、金納ではない。年貢の全額免除でもない。","q":"享保の改革で導入された定免法について正しいものはどれか。"},{"answer":"株仲間を公認し、運上・冥加金を徴収した","chapter":"江戸中期","choices":["株仲間を公認し、運上・冥加金を徴収した","株仲間をすべて解散させた","長崎貿易を全面的に禁止した","印旛沼・手賀沼の干拓を中止した"],"era":"近世","explanation":"正解は、株仲間を公認して税を取る田沼意次の商業重視の政策。株仲間を解散させたのは天保の改革の水野忠邦で、田沼とは逆の方針。長崎貿易は禁止どころか拡大が図られた。印旛沼・手賀沼の干拓も田沼が推進した事業で、中止していない。","q":"老中田沼意次の政策として正しいものはどれか。"},{"answer":"金銀の海外流出を防ぐため、長崎貿易の額や船の数を制限する","chapter":"江戸中期","choices":["金銀の海外流出を防ぐため、長崎貿易の額や船の数を制限する","オランダとの貿易を全面的に禁止する","朱印船貿易を復活させる","朝鮮との貿易を長崎に移す"],"era":"近世","explanation":"正解は、新井白石の進言による貿易制限で、中国船やオランダ船の数・取引額が抑えられた。オランダ貿易は制限の対象ではあっても禁止はされていない。朱印船貿易は1635年に終了しており復活していない。朝鮮貿易は引き続き対馬藩が担い、長崎に移されてはいない。","q":"1715年に出された海舶互市新例（正徳新例）の目的として正しいものはどれか。"},{"answer":"オランダ語の解剖学書『ターヘル・アナトミア』を翻訳したもの","chapter":"江戸中期","choices":["オランダ語の解剖学書『ターヘル・アナトミア』を翻訳したもの","中国から伝わった漢方の医学書を写したもの","英語の解剖学書を直接翻訳したもの","幕府の命令によって編纂された公式の医学書"],"era":"近世","explanation":"正解は、杉田玄白らがオランダ語の解剖書を苦心して翻訳し1774年に刊行した、という内容。中国の漢方書の写しではない。当時学ばれていた西洋の言語はオランダ語で、英語原書からの翻訳ではない。幕府の命令ではなく、民間の蘭学者たちの自主的な事業だった。","q":"杉田玄白らが刊行した『解体新書』について正しいものはどれか。"},{"answer":"輸入に頼っていた砂糖をまかなうため、サトウキビの栽培が広げられた","chapter":"江戸中期","choices":["輸入に頼っていた砂糖をまかなうため、サトウキビの栽培が広げられた","幕府が砂糖の輸入を全面的に禁止したため、やむなく国内生産が始まった","砂糖は最後まで輸入品のみで、国内ではまったく生産されなかった","サトウキビは寒冷な蝦夷地を中心に栽培された"],"era":"近世","explanation":"正解は、8代将軍吉宗らがサトウキビ栽培を奨励し、西南の暖地を中心に国産化が進んだ、という内容。砂糖の輸入自体は禁止されず、その後も輸入は続いた。国内生産が行われなかったというのも誤り。サトウキビは暖かい地方の作物で、蝦夷地が中心というのは逆である。","q":"江戸時代に砂糖の国産化が進んだことについて正しいものはどれか。"},{"answer":"江戸に流入した農民を帰村させ、農村の労働力を回復しようとした","chapter":"江戸後期・幕末","choices":["江戸に流入した農民を帰村させ、農村の労働力を回復しようとした","旗本・御家人の借金を帳消しにした","外国船を日本の沿岸から打ち払うことを命じた","大名に領地の一部を幕府へ差し出させた"],"era":"近世","explanation":"正解は人返しの法の内容で、天保の改革で江戸の人口を減らし農村の労働力を確保しようとした。旗本・御家人の借金を帳消しにしたのは寛政の改革の棄捐令。外国船の打払いを命じたのは1825年の異国船打払令。領地の一部を差し出させるのは同じ天保の改革の上知令で、人返しの法とは別の政策である。","q":"1843年に天保の改革で出された人返しの法の内容として正しいものはどれか。"},{"answer":"大坂で、天保の飢饉の際に救済が拒まれたことなどを背景に起こした","chapter":"江戸後期・幕末","choices":["大坂で、天保の飢饉の際に救済が拒まれたことなどを背景に起こした","江戸で、外国との開国に反対して起こした","長崎で、外国船の来航に抗議して起こした","京都で、朝廷の権威の回復を掲げて起こした"],"era":"近世","explanation":"正解は、大坂町奉行所の元与力だった大塩が、飢饉に苦しむ人々の救済を求めて退けられ、豪商らを襲った、という内容。舞台は江戸ではなく大坂。開国問題が本格化するのは1853年のペリー来航以降で、この乱とは時期が異なる。長崎や京都で起こした反乱でもない。","q":"1837年の大塩平八郎の乱について正しいものはどれか。"},{"answer":"下田と函館の2港を開き、アメリカ船への食料・水などの補給を認めた","chapter":"江戸後期・幕末","choices":["下田と函館の2港を開き、アメリカ船への食料・水などの補給を認めた","横浜など5港を開港し、自由貿易を開始した","アメリカ人に対する領事裁判権を認めた","日本が関税を自由に決める権利を放棄した"],"era":"近世","explanation":"正解は、補給港として下田・函館を開いた日米和親条約の内容。5港の開港と自由貿易、領事裁判権の承認、関税自主権の放棄はいずれも1858年の日米修好通商条約（安政の五カ国条約）の内容で、和親条約とは区別される。","q":"1854年に結ばれた日米和親条約の内容として正しいものはどれか。"},{"answer":"大老の井伊直弼が、条約調印や将軍継嗣問題に反対する人々を弾圧した","chapter":"江戸後期・幕末","choices":["大老の井伊直弼が、条約調印や将軍継嗣問題に反対する人々を弾圧した","老中の水野忠邦が、天保の改革に反対する大商人を弾圧した","将軍の徳川慶喜が、薩摩・長州両藩の藩士を処罰した","朝廷が、幕府の高官を一斉に処罰した"],"era":"近世","explanation":"正解は安政の大獄の説明で、尊王攘夷派の公家・大名・志士らが処罰された。水野忠邦は天保の改革を主導した老中で、この弾圧の主体ではない。慶喜が将軍になるのは1867年で時期が合わない。処罰を行ったのは朝廷ではなく幕府側である。","q":"安政の大獄について正しいものはどれか。"},{"answer":"坂本龍馬らの仲介によって、薩摩藩と長州藩が倒幕のために提携した","chapter":"江戸後期・幕末","choices":["坂本龍馬らの仲介によって、薩摩藩と長州藩が倒幕のために提携した","薩摩藩と会津藩が、幕府を守るために結んだ同盟である","長州藩が幕府に全面降伏して恭順を示した同盟である","薩摩藩とイギリスが結んだ軍事同盟である"],"era":"近世","explanation":"正解は1866年の薩長同盟の説明で、対立していた両藩が坂本龍馬らの仲介で手を結んだ。会津藩は佐幕派の中心で、この同盟の相手ではない。長州藩の降伏ではなく、幕府に対抗するための提携である。イギリスとの軍事同盟でもない。","q":"1866年に結ばれた薩長同盟について正しいものはどれか。"},{"answer":"国訴","chapter":"江戸後期・幕末","choices":["国訴","強訴","逃散","打ちこわし"],"era":"近世","explanation":"正解は国訴。藩主の交代などをきっかけに、幕府の役人へ直接訴え出る形態の百姓の抵抗である。強訴は大勢で領主や役所に押し寄せて強く訴えること。逃散は百姓が村を逃げ去って抵抗すること。打ちこわしは豪商の家などを破壊する都市や農村の暴動で、いずれも訴えの形態が異なる。","q":"江戸時代、藩主の代替わりなどをきっかけに、百姓が幕府へ直接訴え出た行動を何というか。"},{"answer":"学制","chapter":"明治前期","choices":["教育令","学制","学校令","教育勅語"],"era":"近代","explanation":"正解は学制で、1872年に公布され、全国に小学校を設けて就学を促した。教育令は1879年に学制を改めたもので、地域の実情に合わせる自由主義的な制度だった。学校令は1886年に学校制度を整えた諸法令、教育勅語は1890年に示された教育理念であり、1872年の制度ではない。","q":"1872年に公布され、男女や身分を問わず全国に小学校を設けて就学を促した教育制度はどれか。"},{"answer":"地価を基準に、地主が税額として地価の3％を金納する","chapter":"明治前期","choices":["地価を基準に、地主が税額として地価の3％を金納する","土地面積を基準に、地主が収穫の3％を米で納める","地価を基準に、小作人が地価の3％を金納する","土地面積を基準に、村全体が収穫の半分を米で納める"],"era":"近代","explanation":"正解は、地券を交付された地主が、地価の3％に当たる額を現金で納める仕組みである。収穫高や土地面積ではなく地価が基準で、米納ではない。小作人ではなく土地所有者とされた地主が納税者であり、村全体で収穫の半分を納める旧来の年貢方式とも異なる。","q":"1873年に始まった地租改正の内容として正しいものはどれか。"},{"answer":"血税一揆","chapter":"明治前期","choices":["地租改正反対一揆","打ちこわし","血税一揆","秩禄処分への士族反乱"],"era":"近代","explanation":"正解は血税一揆。地租改正反対一揆は地租の負担や地価調査への反発によるもので、徴兵令が原因ではない。打ちこわしは都市で米屋などを襲う民衆行動を指し、特定の徴兵反対一揆の名称ではない。秩禄処分への反発は主に不平士族の反乱として現れた。","q":"1873年の徴兵令公布後、「血税」という語への誤解や徴兵への反発から各地で起こった農民一揆を何というか。"},{"answer":"台湾に漂着した宮古島島民が先住民に殺害されたこと","chapter":"明治前期","choices":["江華島で日本軍艦が砲撃されたこと","台湾に漂着した宮古島島民が先住民に殺害されたこと","ノルマントン号事件で日本人乗客が死亡したこと","清が琉球王国を直轄領としたこと"],"era":"近代","explanation":"正解は1871年の宮古島島民殺害事件で、日本はその報復などを名目に1874年に出兵した。江華島事件は1875年で台湾出兵より後、ノルマントン号事件は1886年の出来事である。清が琉球を直轄領とした事実もなく、直接の契機ではない。","q":"1874年の台湾出兵の直接の契機となった出来事はどれか。"},{"answer":"日朝修好条規","chapter":"明治前期","choices":["日朝修好条規","日清修好条規","日米和親条約","日英通商航海条約"],"era":"近代","explanation":"正解は日朝修好条規で、釜山などの開港や日本の領事裁判権などを定めた。日清修好条規は1871年に結ばれた対等条約、日米和親条約は1854年の条約である。日英通商航海条約は1894年に条約改正を進めた条約で、江華島事件とは関係しない。","q":"1875年の江華島事件を契機として、翌1876年に日本と朝鮮の間で結ばれた条約はどれか。"},{"answer":"伊藤博文","chapter":"明治前期","choices":["松方正義","大隈重信","伊藤博文","山県有朋"],"era":"近代","explanation":"正解は伊藤博文で、1885年の内閣制度発足時に初代内閣総理大臣となった。松方正義は大蔵大臣として財政を担い、首相就任は1891年である。大隈重信の首相就任は1898年、山県有朋の首相就任は1889年であり、いずれも初代ではない。","q":"1885年に太政官制が廃止され内閣制度が発足したとき、初代内閣総理大臣となった人物は誰か。"},{"answer":"不換紙幣の整理 → 日本銀行の設立 → 金本位制の確立","chapter":"明治前期","choices":["金本位制の確立 → 日本銀行の設立 → 不換紙幣の整理","不換紙幣の整理 → 日本銀行の設立 → 金本位制の確立","日本銀行の設立 → 金本位制の確立 → 不換紙幣の発行開始","不換紙幣の整理 → 金本位制の確立 → 日本銀行の設立"],"era":"近代","explanation":"正解は「不換紙幣の整理→日本銀行の設立→金本位制の確立」。金本位制は日清戦争の賠償金を準備金として1897年に確立し、日本銀行の設立は1882年なので、金本位制を最初に置く順序は誤りである。不換紙幣は明治初年から発行されていたため、日本銀行設立後に発行開始とする順序も誤りで、金本位制を日本銀行設立前とする順序も誤りである。","q":"明治期の貨幣制度の変化として、正しい順序はどれか。"},{"answer":"防穀令事件","chapter":"明治後期","choices":["壬午軍乱","東学党の乱","甲申事変","防穀令事件"],"era":"近代","explanation":"正解は防穀令事件で、1889年に朝鮮の地方官が穀物輸出を禁止したため、日本商人が損害賠償などを求めた。壬午軍乱は1882年の朝鮮軍兵士らによる反乱、甲申事変は1884年の改革派による政変である。東学党の乱は1894年の農民反乱で、防穀令をめぐる事件ではない。","q":"1889年、朝鮮の地方官が凶作を理由に大豆などの輸出を禁止し、日本商人が損害賠償などを求めた事件はどれか。"},{"answer":"領事裁判権の撤廃","chapter":"明治後期","choices":["領事裁判権の撤廃","関税自主権の完全回復","韓国併合の承認","横浜・長崎・箱館の開港"],"era":"近代","explanation":"正解は領事裁判権の撤廃で、1894年調印の日英通商航海条約によって実現した。関税自主権の完全回復は1911年であり、この条約の成果ではない。韓国併合は1910年の別個の出来事で、横浜・長崎・箱館の開港は安政の通商条約に基づく1859年のことである。","q":"1894年に調印され、1899年の施行によって実現した条約改正の成果はどれか。"},{"answer":"国定教科書制度","chapter":"明治後期","choices":["検定制度の新規導入","国定教科書制度","自由発行制度","教育勅語の教科書化"],"era":"近代","explanation":"正解は国定教科書制度で、1903年から国が小学校教科書を編集・発行した。検定制度は1886年以来すでに存在し、1903年に初めて導入されたものではない。自由発行制度は国の関与を弱める仕組みで国定化とは逆であり、教育勅語は道徳の理念を示す文書で、小学校教科書そのものを国定化する制度ではない。","q":"1903年に始まった、小学校教科書に関する制度はどれか。"},{"answer":"南樺太の割譲と南満州の鉄道権益などの移譲","chapter":"明治後期","choices":["日本が賠償金を受け取ること","日本が直ちに韓国を併合すること","南樺太の割譲と南満州の鉄道権益などの移譲","遼東半島全体を日本の領土とすること"],"era":"近代","explanation":"正解は、南樺太が割譲され、遼東半島の租借権や南満州鉄道の権益がロシアから日本へ移されたことである。ポーツマス条約では賠償金は認められなかった。韓国併合は1910年であり、遼東半島は領土割譲ではなく租借権の移譲だった。","q":"日露戦争の講和条約であるポーツマス条約の内容として正しいものはどれか。"},{"answer":"土地所有権を確定し、地税徴収の基礎を整えること","chapter":"明治後期","choices":["土地所有権を確定し、地税徴収の基礎を整えること","朝鮮の全土地を日本人へ無償で配分すること","小作農をすべて自作農へ転換すること","日本本土の地租改正と同じ税率を直ちに導入すること"],"era":"近代","explanation":"正解は、土地台帳や地籍図を作って所有権と地税の基礎を近代的に整えることだった。全土地を日本人へ無償配分する制度ではなく、小作農の一律な自作農化も目的ではない。税制整備の一環ではあるが、狙いは本土の地租改正と同一税率を直ちに導入することではなかった。","q":"1910年代に朝鮮総督府が実施した土地調査事業の主な目的はどれか。"},{"answer":"交戦国向け輸出の増加で海運・造船や重化学工業が発展したこと","chapter":"大正","choices":["日本がヨーロッパ主戦場へ大軍を派遣したこと","米価が急落して民衆の生活不安が解消したこと","戦争によって日本の輸出が長期にわたり停止したこと","交戦国向け輸出の増加で海運・造船や重化学工業が発展したこと"],"era":"近代","explanation":"正解は大戦景気の特徴で、輸出増と輸入途絶を背景に海運・造船・重化学工業などが伸びた。日本はドイツに宣戦したが、ヨーロッパ主戦場へ大軍は派遣していない。米価はむしろ高騰して米騒動につながり、輸出も長期停止ではなくアジアやアメリカ向けを中心に拡大した。","q":"第一次世界大戦期の日本経済について、正しいものはどれか。"},{"answer":"第二次護憲運動","chapter":"大正","choices":["第一次護憲運動","第二次護憲運動","普通選挙運動","大正デモクラシー運動"],"era":"近代","explanation":"正解は第二次護憲運動で、護憲三派の選挙勝利を受けて加藤高明内閣が成立した。第一次護憲運動は1912〜13年に桂太郎内閣を退陣させた運動である。普通選挙運動は選挙権拡大を求める運動で、護憲三派の連携そのものではない。大正デモクラシーはこの時期の思想・運動全体を指す総称である。","q":"1924年、清浦奎吾内閣の打倒を目指し、憲政会・政友会・革新倶楽部が連携した運動はどれか。"},{"answer":"新婦人協会","chapter":"大正","choices":["新婦人協会","青鞜社","赤瀾会","全国水平社"],"era":"近代","explanation":"正解は新婦人協会。青鞜社は1911年創刊の『青鞜』を中心とする文学団体、赤瀾会は1921年結成の社会主義系女性団体である。全国水平社は1922年に被差別部落の解放を掲げて結成された団体で、女性の政治参加を求めた団体ではない。","q":"1920年に平塚らいてう・市川房枝らが設立し、女性が政治集会へ参加できるよう治安警察法の改正などを求めた団体はどれか。"},{"answer":"四カ国条約","chapter":"大正","choices":["ヴェルサイユ条約","ロンドン海軍軍縮条約","四カ国条約","不戦条約"],"era":"近代","explanation":"正解は四カ国条約で、太平洋の領土・権益を尊重し合う取り決めにより日英同盟は終了した。ヴェルサイユ条約は1919年の第一次世界大戦講和条約、ロンドン海軍軍縮条約は1930年の条約である。不戦条約は1928年の条約で、ワシントン会議で締結されたものではない。","q":"1921〜22年のワシントン会議に関連して締結され、日英同盟の終了につながった条約はどれか。"},{"answer":"リットン報告書に基づく連盟総会の勧告案が採択されたこと","chapter":"昭和戦前","choices":["盧溝橋事件を機に日中戦争が全面化したこと","リットン報告書に基づく連盟総会の勧告案が採択されたこと","五・一五事件で犬養毅首相が暗殺されたこと","日本が海軍軍縮条約の廃棄を通告したこと"],"era":"近代","explanation":"正解は、1933年に連盟総会がリットン報告書に基づく勧告案を採択し、満州国を承認しなかったことである。盧溝橋事件は1937年で脱退後、五・一五事件は1932年の国内事件で直接の契機ではない。海軍軍縮条約の廃棄通告は1934年で、連盟脱退通告の後である。","q":"日本が1933年に国際連盟脱退を通告する直接の契機となった出来事はどれか。"},{"answer":"南満州鉄道株式会社","chapter":"昭和戦前","choices":["南満州鉄道株式会社","東洋拓殖株式会社","朝鮮銀行","日本勧業銀行"],"era":"近代","explanation":"正解は南満州鉄道株式会社（満鉄）で、1906年に設立され鉄道経営を中心に満州経営を担った。東洋拓殖株式会社は主に朝鮮の開発を目的とした会社、朝鮮銀行は朝鮮における中央銀行である。日本勧業銀行は国内の農工業金融を担う銀行で、満州経営の中心ではなかった。","q":"日露戦争後、満州経営の中心となった半官半民の会社はどれか。"},{"answer":"浜口雄幸内閣","chapter":"昭和戦前","choices":["田中義一内閣","犬養毅内閣","若槻礼次郎内閣","浜口雄幸内閣"],"era":"近代","explanation":"正解は浜口雄幸内閣で、1930年1月に緊縮財政のもと金輸出を再解禁した。田中義一内閣は1927〜29年で再解禁前、犬養毅内閣は1931年に金輸出再禁止へ転じた。若槻礼次郎内閣は1927年の金融恐慌時の内閣などであり、1930年の再解禁を実施した内閣ではない。","q":"1930年1月に金輸出解禁を断行し、世界恐慌の影響を正面から受けた内閣はどれか。"},{"answer":"国民徴用令","chapter":"昭和戦前","choices":["治安維持法","兵役法","国民徴用令","労働組合法"],"era":"近代","explanation":"正解は国民徴用令で、1939年に国家総動員法に基づいて国民の徴用を可能にした。治安維持法は1925年の思想・結社取り締まり法、兵役法は軍への徴兵を定める法制である。労働組合法は戦後の1945年に労働者の団結権などを保障した法律で、戦時動員の法令ではない。","q":"1939年に国家総動員法に基づいて公布され、国民を軍需産業などへ配置する根拠となった法令はどれか。"},{"answer":"財閥解体","chapter":"占領・戦後改革","choices":["財閥解体","農地改革","公職追放","レッドパージ"],"era":"現代","explanation":"正解は財閥解体で、持株会社の解散などにより財閥家族の企業支配を取り除いた。農地改革は土地所有の改革、公職追放は戦時指導者の排除であり、いずれも企業集団の解体策ではない。レッドパージは占領後期に共産主義者を追放した措置で、経済民主化の財閥政策とは異なる。","q":"占領期にGHQの指令で進められた経済民主化政策のうち、三井・三菱などの企業集団に対する措置はどれか。"},{"answer":"政府が地主の小作地を強制的に買い上げ、耕作する小作人に売り渡した","chapter":"占領・戦後改革","choices":["政府が地主の小作地を強制的に買い上げ、耕作する小作人に売り渡した","地主が小作地を任意に寄付し、小作人が共同で経営した","農地をすべて国有化し、農民を国営農場の労働者にした","小作料の引上げを認め、地主の収益を保障した"],"era":"現代","explanation":"正解は、政府が地主の小作地を買い上げて小作人に売り渡し、自作農を増やした農地改革である。任意の寄付による改革ではなく、農地がすべて国有化されて国営農場化したわけでもない。小作料は引き上げが認められたのではなく、統制・引き下げの対象となった。","q":"戦後の農地改革の内容として正しいものはどれか。"},{"answer":"預金を封鎖し、新円への切替えを通じてインフレを抑える","chapter":"占領・戦後改革","choices":["預金を封鎖し、新円への切替えを通じてインフレを抑える","金本位制に復帰して旧円の価値を保障する","外国通貨を導入して国内通貨を廃止する","政府紙幣を無制限に発行して財政赤字を埋める"],"era":"現代","explanation":"正解は新円切替えで、預金封鎖と新円への交換により通貨量を抑え、インフレの抑制を狙った。金本位制への復帰ではなく、外国通貨によって国内通貨を置き換える措置でもない。政府紙幣を無制限に発行すればインフレを助長するため、政策の方向は正反対である。","q":"1946年に金融緊急措置によって行われた新円切替えの目的として、最も適切なものはどれか。"},{"answer":"国民主権・基本的人権の尊重・平和主義","chapter":"占領・戦後改革","choices":["国民主権・基本的人権の尊重・平和主義","天皇主権・国家総動員・言論統制","国民主権・軍備増強・植民地拡大","基本的人権の尊重・公職追放・財閥解体"],"era":"現代","explanation":"正解は国民主権・基本的人権の尊重・平和主義の組み合わせである。天皇主権は大日本帝国憲法の原則であり、国家総動員や言論統制は戦時体制の要素である。軍備増強と植民地拡大も憲法の原則ではない。公職追放と財閥解体は占領改革であって、日本国憲法の三大原則には含まれない。","q":"日本国憲法の三大原則の組み合わせとして正しいものはどれか。"},{"answer":"女性の参政権","chapter":"占領・戦後改革","choices":["女性の参政権","18歳選挙権","小選挙区比例代表並立制","普通選挙の廃止"],"era":"現代","explanation":"正解は女性の参政権で、1945年の改正により女性に選挙権と被選挙権が認められた。18歳選挙権は2015年の法改正で導入された。小選挙区比例代表並立制は1994年に導入された制度である。普通選挙は廃止されたのではなく、1925年の男子普通選挙から女性を含む制度へ広げられた。","q":"1945年の衆議院議員選挙法改正によって初めて認められたものはどれか。"},{"answer":"超均衡予算と補助金の削減によりインフレ収束を図る","chapter":"占領・戦後改革","choices":["超均衡予算と補助金の削減によりインフレ収束を図る","石炭・鉄鋼に資源を集中して生産回復を図る","所得税中心の税制を整えるよう勧告する","朝鮮戦争の軍需によって輸出と生産を伸ばす"],"era":"現代","explanation":"正解は、超均衡予算と補助金削減によってインフレ収束を図るドッジ・ラインである。石炭・鉄鋼への重点配分は傾斜生産方式、所得税中心の税制改革はシャウプ勧告の内容である。朝鮮戦争による軍需の拡大は特需景気という現象であり、ドッジ・ラインそのものではない。","q":"1949年に実施されたドッジ・ラインの内容として正しいものはどれか。"},{"answer":"警察予備隊","chapter":"占領・戦後改革","choices":["警察予備隊","保安隊","自衛隊","海上警備隊"],"era":"現代","explanation":"正解は1950年に創設された警察予備隊である。保安隊と海上警備隊は1952年に設けられた組織で、警察予備隊より後の段階にあたる。自衛隊は1954年に保安隊などを改組して発足したため、朝鮮戦争勃発直後の組織ではない。","q":"朝鮮戦争の勃発を背景として、1950年に創設された組織はどれか。"},{"answer":"家制度","chapter":"占領・戦後改革","choices":["家制度","戸籍制度","成年制度","相続制度"],"era":"現代","explanation":"正解は家制度で、戦後の民法改正により戸主を中心とする家制度は廃止された。戸籍制度そのものは存続し、成年制度も廃止されなかった。相続制度も残され、配偶者や子の相続分などが見直された。","q":"戦後の民法改正によって廃止された制度はどれか。"},{"answer":"サンフランシスコ平和条約","chapter":"独立・高度成長","choices":["サンフランシスコ平和条約","日米安全保障条約","日ソ共同宣言","日韓基本条約"],"era":"現代","explanation":"正解はサンフランシスコ平和条約で、この発効により日本の主権が回復した。日米安全保障条約は同じ時期に結ばれたが、内容はアメリカ軍の日本駐留などに関するものである。日ソ共同宣言は1956年、日韓基本条約は1965年のもので、講和条約ではない。","q":"1951年に調印され、日本の主権回復を定めた条約はどれか。"},{"answer":"日米相互協力及び安全保障条約の調印","chapter":"独立・高度成長","choices":["日米相互協力及び安全保障条約の調印","MSA協定の締結","沖縄返還協定の調印","旧日米安全保障条約の調印"],"era":"現代","explanation":"正解は1960年の日米相互協力及び安全保障条約、いわゆる新安保条約の調印である。MSA協定は1954年、沖縄返還協定は1971年に調印された。旧日米安全保障条約は1951年にサンフランシスコ平和条約と同時に調印されたものである。","q":"1960年に行われた日米関係の出来事はどれか。"},{"answer":"アジア・アフリカ諸国が平和共存と反植民地主義を確認した","chapter":"独立・高度成長","choices":["アジア・アフリカ諸国が平和共存と反植民地主義を確認した","日本がNATOに加盟して共産圏への対抗を決めた","東南アジア諸国が集団防衛条約を締結した","日本の国際連合加盟を正式に決定した"],"era":"現代","explanation":"正解は、アジア・アフリカ諸国が平和共存と反植民地主義を確認した会議である。NATOは北大西洋の集団防衛機構で、日本は加盟していない。集団防衛を目的としたSEATOは前年に結成された別の枠組みである。日本の国連加盟は1956年に実現し、バンドン会議で決定されたものではない。","q":"1955年に開かれたアジア・アフリカ会議（バンドン会議）の性格として、最も適切なものはどれか。"},{"answer":"東海道新幹線","chapter":"独立・高度成長","choices":["東海道新幹線","山陽新幹線","東北新幹線","上越新幹線"],"era":"現代","explanation":"正解は1964年に東京・新大阪間で開業した東海道新幹線である。山陽新幹線は1970年代に順次開業した路線である。東北新幹線と上越新幹線はいずれも1982年に開業しており、東京オリンピックの時期には存在しなかった。","q":"1964年の東京オリンピックにあわせて開業した高速鉄道はどれか。"},{"answer":"農業の生産性を高め、他産業との所得格差を是正する","chapter":"独立・高度成長","choices":["農業の生産性を高め、他産業との所得格差を是正する","小作制度を復活させて地主制を保護する","米の生産調整を直ちに全面的に実施する","農地を国営化して集団農場に再編する"],"era":"現代","explanation":"正解は、農業の近代化と生産性向上によって、他産業との所得格差を是正することである。小作制度を復活させる政策ではなく、農地を国営化して集団農場化するものでもない。米の生産調整、いわゆる減反政策が本格化したのは1970年以降で、農業基本法の制定直後の内容ではない。","q":"1961年に制定された農業基本法の目的として、最も適切なものはどれか。"},{"answer":"沖縄返還協定","chapter":"独立・高度成長","choices":["沖縄返還協定","日米相互協力及び安全保障条約","MSA協定","サンフランシスコ平和条約"],"era":"現代","explanation":"正解は1971年に調印された沖縄返還協定で、1972年に沖縄の施政権が日本へ返還された。日米相互協力及び安全保障条約は1960年、MSA協定は1954年のものである。サンフランシスコ平和条約は1951年の講和条約で、沖縄をアメリカの施政下に置く前提となった。","q":"1971年に調印され、翌年に沖縄の施政権返還を実現した協定はどれか。"},{"answer":"日中共同声明","chapter":"独立・高度成長","choices":["日中共同声明","日中平和友好条約","日中共同宣言","日韓基本条約"],"era":"現代","explanation":"正解は1972年の日中共同声明で、これにより日本と中華人民共和国の国交が正常化した。日中平和友好条約は1978年、日中共同宣言は1998年の文書である。日韓基本条約は1965年に韓国との国交を正常化した条約で、中国との関係ではない。","q":"1972年に日中国交正常化を実現した文書はどれか。"},{"answer":"国鉄を分割し、JR各社として民営化した","chapter":"安定成長・冷戦後","choices":["国鉄を分割し、JR各社として民営化した","国鉄を一つの公社のまま存続させた","国鉄の全路線を都道府県へ移管した","新幹線だけを外国企業へ売却した"],"era":"現代","explanation":"正解は、国鉄を分割してJR各社を発足させた民営化である。一つの公社のまま存続したのではなく、組織そのものが再編された。全路線が都道府県へ移管されたわけでも、新幹線だけが外国企業へ売却されたわけでもない。","q":"1987年に実施された国鉄改革の内容として正しいものはどれか。"},{"answer":"ドル高が是正され、円高が進んだ","chapter":"安定成長・冷戦後","choices":["ドル高が是正され、円高が進んだ","円安が固定され、日本の輸出が拡大した","主要国が金本位制へ復帰した","日本がユーロを共通通貨として導入した"],"era":"現代","explanation":"正解は、行き過ぎたドル高を是正する協調が進み、円高が進行したことである。円安を固定して輸出を拡大する合意ではなく、その後の日本経済には円高不況が起こった。金本位制への復帰は行われず、ユーロはヨーロッパの通貨統合によるもので、日本は導入していない。","q":"1985年のプラザ合意によって進んだ為替相場の変化はどれか。"},{"answer":"冷戦の終結","chapter":"安定成長・冷戦後","choices":["冷戦の終結","ソビエト連邦の即時解体","NATOの解散","ワルシャワ条約機構の拡大"],"era":"現代","explanation":"正解は冷戦の終結で、マルタ会談は米ソ対立の時代が終わった象徴となった。ソビエト連邦が解体したのは1991年であり、マルタ会談で即時解体が決まったわけではない。NATOは解散せず、ワルシャワ条約機構も拡大ではなく1991年に解散した。","q":"1989年のマルタ会談で宣言された出来事はどれか。"},{"answer":"自衛隊が国連平和維持活動に参加すること","chapter":"安定成長・冷戦後","choices":["自衛隊が国連平和維持活動に参加すること","自衛隊が他国の戦争へ自動的に参戦すること","日本が核兵器を保有すること","国連軍の司令部を日本に設置すること"],"era":"現代","explanation":"正解は、自衛隊が一定の条件のもとで国連平和維持活動などに参加できるようになったことである。他国の戦争へ自動的に参戦する法律ではなく、核兵器の保有を認めるものでもない。国連軍の司令部を日本へ設置する内容も含まれていない。","q":"1992年に制定されたPKO協力法によって可能になった活動はどれか。"},{"answer":"3%","chapter":"安定成長・冷戦後","choices":["3%","5%","8%","10%"],"era":"現代","explanation":"正解は3%で、消費税は1989年に税率3%で導入された。5%への引上げは1997年、8%への引上げは2014年に行われた。10%への引上げは2019年で、導入当初の税率ではない。","q":"1989年に導入された当初の消費税率はどれか。"}];
function loadRecords(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch{return {}}}
function saveRecords(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function recordFor(q){const r=records[q];return r&&typeof r==='object'?r:{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function seededShuffle(items,seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}let state=h>>>0;const rand=()=>{state=(state+0x6D2B79F5)>>>0;let t=state;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296};const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){session=null;const eras=[...new Set(QUESTIONS.map(x=>x.era))];const missed=QUESTIONS.filter(x=>recordFor(x.q).status==='wrong');app.innerHTML=`<section class="hero"><div class="eyebrow">DAILY HISTORY PRACTICE</div><h1>日本史トレーニング</h1><p>一問ずつ答えて、知識を積み上げよう。</p></section><section class="card"><h2 class="section-title">学習モード</h2><div class="modes"><button class="btn primary mode" id="today"><span>今日の10問<small>日替わりチャレンジ</small></span><span>→</span></button><button class="btn secondary mode" id="eraMode"><span>時代から選ぶ<small>範囲を決めて学習</small></span><span>→</span></button><button class="btn secondary mode" id="chronologyMode"><span>年代整序<small>出来事を古い順に並べる</small></span><span>→</span></button><button class="btn secondary mode" id="choicesMode"><span>4択<small>選択肢から答える</small></span><span>→</span></button><button class="btn secondary mode" id="wrongMode"><span>間違えた問題<small>${missed.length}問を復習</small></span><span>→</span></button></div></section><section class="card"><h2 class="section-title">時代ごとの進捗</h2>${eras.map(era=>{const qs=QUESTIONS.filter(q=>q.era===era),done=qs.filter(q=>recordFor(q.q).status==='correct').length;return `<div class="era-row"><div class="era-head"><span>${esc(era)}</span><span class="era-count">${done} / ${qs.length}問</span></div><div class="track"><div class="fill" style="width:${qs.length?done/qs.length*100:0}%"></div></div></div>`}).join('')}</section>`;document.getElementById('today').onclick=()=>{const date=new Date(),key=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;start(seededShuffle(QUESTIONS,key).slice(0,10),'今日の10問')};document.getElementById('eraMode').onclick=showEras;document.getElementById('chronologyMode').onclick=showChronologyEras;document.getElementById('choicesMode').onclick=showChoiceEras;document.getElementById('wrongMode').onclick=()=>{const qs=QUESTIONS.filter(q=>recordFor(q.q).status==='wrong');if(!qs.length){empty('間違えた問題はありません。', 'ホームへ戻る');return}start(seededShuffle(qs,randomSeed()),'間違えた問題')}}
let choiceSession=null;
function showChoiceEras(){const eras=[...new Set(CHOICES.map(q=>q.era))];app.innerHTML=`<div class="screen-head"><h2>4択｜時代を選ぶ</h2><button class="btn plain small" id="choiceHome">ホーム</button></div><section class="card"><div class="era-list">${eras.map(era=>{const count=CHOICES.filter(q=>q.era===era).length;return `<button class="btn secondary era-choice" data-era="${esc(era)}"><span>${esc(era)}<small>${count}問</small></span><span>→</span></button>`}).join('')}</div></section>`;document.getElementById('choiceHome').onclick=home;app.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>startChoices(b.dataset.era))}
function startChoices(era){const pool=CHOICES.filter(q=>q.era===era);choiceSession={era,items:seededShuffle(pool,randomSeed()).slice(0,Math.min(10,pool.length)),index:0,correct:0,answered:false,options:[]};renderChoice()}
function renderChoice(){const s=choiceSession;if(s.index>=s.items.length){renderChoiceResult();return}const q=s.items[s.index];s.answered=false;s.options=seededShuffle(q.choices,randomSeed());app.innerHTML=`<div class="screen-head"><h2>4択｜${esc(s.era)}</h2><button class="btn plain small" id="choiceQuit">終了</button></div><section class="card"><div class="eyebrow">QUESTION ${s.index+1} / ${s.items.length}</div><h2>${esc(q.q)}</h2><div class="choice-options">${s.options.map((c,i)=>`<button class="btn secondary choice-option" data-choice="${i}">${esc(c)}</button>`).join('')}</div><div id="choiceFeedback"></div></section>`;document.getElementById('choiceQuit').onclick=home;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.choice)))}
function answerChoice(i){const s=choiceSession;if(s.answered)return;s.answered=true;const q=s.items[s.index],picked=s.options[i],ok=picked===q.answer;if(ok)s.correct++;app.querySelectorAll('[data-choice]').forEach((b,n)=>{b.disabled=true;if(s.options[n]===q.answer)b.classList.add('correct');if(n===i&&!ok)b.classList.add('wrong')});const box=document.getElementById('choiceFeedback');box.innerHTML=`<div class="feedback ${ok?'correct':'wrong'}"><strong>${ok?'正解！':'不正解'}</strong><p>正解：${esc(q.answer)}</p><p>${esc(q.explanation)}</p><button class="btn primary" id="choiceNext">次の問題 →</button></div>`;document.getElementById('choiceNext').onclick=()=>{s.index++;renderChoice()}}
function renderChoiceResult(){const s=choiceSession;app.innerHTML=`<section class="card result"><div class="eyebrow">SESSION COMPLETE</div><h2>4択 終了！</h2><div class="score">${s.correct}<span style="font-size:20px;color:var(--muted)"> / ${s.items.length}問</span></div><div class="result-actions"><button class="btn primary" id="choiceAgain">もう一度</button><button class="btn plain" id="choiceHome">ホームへ</button></div></section>`;document.getElementById('choiceAgain').onclick=()=>startChoices(s.era);document.getElementById('choiceHome').onclick=home}
function randomSeed(){return `${Date.now()}-${Math.random()}`}
function showEras(){const eras=[...new Set(QUESTIONS.map(q=>q.era))];app.innerHTML=`<div class="screen-head"><h2>時代を選ぶ</h2><button class="btn plain small" id="backHome">ホーム</button></div><section class="card choice-list">${eras.map(e=>`<button class="btn secondary choice" data-era="${esc(e)}"><span>${esc(e)}</span><span>→</span></button>`).join('')}</section>`;document.getElementById('backHome').onclick=home;app.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>showChapters(b.dataset.era))}
function showChapters(era){const chapters=[...new Set(QUESTIONS.filter(q=>q.era===era).map(q=>q.chapter))];app.innerHTML=`<div class="screen-head"><h2>${esc(era)} <span class="subtle">› 章を選ぶ</span></h2><button class="btn plain small" id="backEra">戻る</button></div><section class="card choice-list">${chapters.map(c=>{const n=QUESTIONS.filter(q=>q.era===era&&q.chapter===c).length;return `<button class="btn secondary choice" data-chapter="${esc(c)}"><span>${esc(c)}<small class="subtle">　${n}問</small></span><span>→</span></button>`}).join('')}</section>`;document.getElementById('backEra').onclick=showEras;app.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>start(seededShuffle(QUESTIONS.filter(q=>q.era===era&&q.chapter===b.dataset.chapter),randomSeed()),`${era} · ${b.dataset.chapter}`))}

function showChronologyEras(){const eras=['原始・古代','中世','近世','近代','現代'];app.innerHTML=`<div class="screen-head"><h2>年代整序 · 時代を選ぶ</h2><button class="btn plain small" id="chronoHome">ホーム</button></div><section class="card choice-list"><button class="btn primary choice" data-chrono-era="全時代"><span>全時代</span><span>→</span></button>${eras.map(e=>`<button class="btn secondary choice" data-chrono-era="${e}"><span>${e}</span><span>→</span></button>`).join('')}</section>`;document.getElementById('chronoHome').onclick=home;app.querySelectorAll('[data-chrono-era]').forEach(b=>b.onclick=()=>startChronology(b.dataset.chronoEra))}
function pickChronology(era){const pool=CHRONOLOGY.filter(x=>era==='全時代'||x.era===era);if(era!=='全時代'){const unique=[...new Map(pool.map(x=>[x.year,x])).values()];return unique.length>=4?seededShuffle(unique,randomSeed()).slice(0,4):[]}const eras=seededShuffle(['原始・古代','中世','近世','近代','現代'],randomSeed());for(const order of [eras,...eras.map((_,i)=>eras.slice(i).concat(eras.slice(0,i)))]){const picks=[];for(const e of order){const candidates=seededShuffle(CHRONOLOGY.filter(x=>x.era===e&&!picks.some(y=>y.year===x.year)),randomSeed());if(candidates.length)picks.push(candidates[0]);if(picks.length===4)break}if(picks.length===4)return picks}return []}
function startChronology(era){const items=pickChronology(era);if(items.length<4){app.innerHTML=`<section class="card empty"><p>この範囲では年代の異なる4件を用意できません。</p><button class="btn primary" id="chronoBack">時代選択へ</button></section>`;document.getElementById('chronoBack').onclick=showChronologyEras;return}chronologySession={era,items:seededShuffle(items,randomSeed()),selected:[],answered:false,correct:0,total:0};renderChronology()}
let chronologySession=null;
function renderChronology(){const s=chronologySession;app.innerHTML=`<div class="screen-head"><h2>年代整序 · ${s.era}</h2><button class="btn plain small" id="chronoQuit">ホーム</button></div><section class="card"><div class="question-meta"><span class="pill">古い順に選択</span><span class="pill">4件</span><span class="chrono-score">正解 ${s.correct} / 出題 ${s.total}</span></div><p class="subtle">出来事を古い順だと思う順にタップしてください。</p><div class="chrono-cards">${s.items.map((x,i)=>`<button class="chrono-card ${s.selected.includes(i)?'selected':''}" data-chrono-card="${i}" ${s.answered?'disabled':''}>${esc(x.event)}<span class="chrono-rank">${s.selected.indexOf(i)+1}</span></button>`).join('')}</div><div class="chrono-actions"><button class="btn plain" id="chronoReset" ${s.selected.length||s.answered?'':'disabled'}>リセット</button><button class="btn primary" id="chronoCheck" ${s.selected.length===4&&!s.answered?'':'disabled'}>答え合わせ</button></div><div id="chronoFeedback"></div></section>`;document.getElementById('chronoQuit').onclick=home;app.querySelectorAll('[data-chrono-card]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.chronoCard);if(!s.answered&&!s.selected.includes(i)&&s.selected.length<4){s.selected.push(i);renderChronology()}});document.getElementById('chronoReset').onclick=()=>{s.selected=[];renderChronology()};document.getElementById('chronoCheck').onclick=checkChronology;if(s.answered)showChronologyAnswer()}
function checkChronology(){const s=chronologySession,correct=[...s.items].sort((a,b)=>a.year-b.year).map(x=>x.event),chosen=s.selected.map(i=>s.items[i].event);s.answered=true;s.total++;if(correct.every((x,i)=>x===chosen[i]))s.correct++;renderChronology()}
function showChronologyAnswer(){const s=chronologySession,correct=[...s.items].sort((a,b)=>a.year-b.year),chosen=s.selected.map(i=>s.items[i].event),ok=correct.every((x,i)=>x.event===chosen[i]);const box=document.getElementById('chronoFeedback');box.className=`feedback ${ok?'correct':'wrong'}`;box.innerHTML=`<strong>${ok?'正解！':'不正解'}</strong><div>正しい順序</div><ol class="chrono-answer">${correct.map(x=>`<li><span class="chrono-year">${x.year}年</span>${esc(x.event)}</li>`).join('')}</ol><div class="feedback-actions"><button class="btn primary" id="chronoNext">次の問題 →</button></div>`;document.getElementById('chronoNext').onclick=()=>{const next=pickChronology(s.era);s.items=seededShuffle(next,randomSeed());s.selected=[];s.answered=false;renderChronology()}}
function start(qs,title){session={items:qs,index:0,correct:0,title,answered:false};renderQuestion()}
function renderQuestion(){const s=session;if(!s||s.index>=s.items.length){showResult();return}const q=s.items[s.index];s.answered=false;app.innerHTML=`<div class="screen-head"><h2>${esc(s.title)}</h2><button class="btn plain small" id="quit">ホーム</button></div><section class="card"><div class="question-meta"><span class="pill">${s.index+1} / ${s.items.length}</span><span class="pill">正解 ${s.correct}問</span><span>${esc(q.era)} · ${esc(q.chapter)}</span></div><div class="progress-line"><div style="width:${s.index/s.items.length*100}%"></div></div><p class="question">${esc(q.q)}</p><form class="answer-form" id="answerForm"><input id="answerInput" type="text" placeholder="答えを入力" autocomplete="off" autocapitalize="off" aria-label="答え"><button class="btn primary" type="submit">答える</button></form><div id="feedback"></div></section>`;document.getElementById('quit').onclick=home;document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer()};document.getElementById('answerInput').focus()}
function normalize(s){return String(s).normalize('NFKC').trim().replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))}
function submitAnswer(){if(session.answered)return;const q=session.items[session.index],input=document.getElementById('answerInput'),accepted=[q.a,...q.aliases].map(normalize),correct=accepted.includes(normalize(input.value));session.answered=true;if(correct){session.correct++;records[q.q]={status:'correct'};saveRecords()}else{records[q.q]={status:'wrong'};saveRecords()}input.disabled=true;document.querySelector('#answerForm button').disabled=true;const box=document.getElementById('feedback');box.className=`feedback ${correct?'correct':'wrong'}`;box.innerHTML=correct?'<strong>正解！</strong>':'<strong>不正解</strong><div class="answer">正解：'+esc(q.a)+'</div>';box.insertAdjacentHTML('beforeend',`<div class="feedback-actions"><button class="btn ${correct?'primary':'secondary'}" id="next">${session.index+1===session.items.length?'結果を見る':'次の問題へ'} →</button></div>`);document.getElementById('next').onclick=()=>{session.index++;renderQuestion()}}
function showResult(){const s=session,rate=s.items.length?Math.round(s.correct/s.items.length*100):0;app.innerHTML=`<section class="card result"><div class="eyebrow">SESSION COMPLETE</div><h2>おつかれさま！</h2><div class="score">${s.correct}<span style="font-size:20px;color:var(--muted)"> / ${s.items.length}問</span></div><p>正答率 <strong>${rate}%</strong></p><p class="subtle">${esc(s.title)}</p><div class="result-actions"><button class="btn primary" id="again">もう一度</button><button class="btn plain" id="homeBtn">ホームへ</button></div></section>`;document.getElementById('again').onclick=()=>start(seededShuffle(s.items,randomSeed()),s.title);document.getElementById('homeBtn').onclick=home}
function empty(message,button){app.innerHTML=`<section class="card empty"><p>${esc(message)}</p><button class="btn primary" id="emptyHome">${esc(button)}</button></section>`;document.getElementById('emptyHome').onclick=home}
home();
</script></body></html>
